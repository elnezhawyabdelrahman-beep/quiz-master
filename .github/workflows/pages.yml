name: Deploy Quiz Master to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Validate question bank and dashboard parity
        run: |
          node <<'NODE'
          const fs = require('fs');
          const assert = require('assert');
          const index = fs.readFileSync('index.html', 'utf8');
          const admin = fs.readFileSync('admin-local.html', 'utf8');
          const live = JSON.parse(fs.readFileSync('question-bank-live.json', 'utf8'));
          function arrayFrom(source, pattern, label) {
            const match = source.match(pattern);
            assert(match, 'Missing ' + label);
            return Function('"use strict"; return (' + match[1] + ')')();
          }
          const base = arrayFrom(index, /const BASE_Q=(\[[\s\S]*?\])\.concat\(/, 'base questions');
          const categories = arrayFrom(index, /const BASE_CATS=(\[[\s\S]*?\]);/, 'base categories');
          const extras = [
            ['question-bank.js', /const EXTRA_Q\s*=\s*(\[[\s\S]*?\]);/],
            ['question-bank-new.js', /const EXTRA_Q2\s*=\s*(\[[\s\S]*?\]);/],
            ['question-bank-islamic.js', /const EXTRA_Q3\s*=\s*(\[[\s\S]*?\]);/]
          ].map(([file, pattern]) => arrayFrom(fs.readFileSync(file, 'utf8'), pattern, file));
          const baseQuestions = base.concat(...extras).map((q, i) => ({
            id: 'q' + (i + 1), cat: q[0], text: q[1], opts: q[2], correct: q[3],
            explain: q[4] || '', source: q[5] || '', difficulty: q[6] || 'easy'
          }));
          const questions = baseQuestions
            .filter(q => !(live.deletedQuestionIds || []).includes(q.id))
            .map(q => Object.assign({}, q, (live.questionOverrides || {})[q.id] || {}))
            .concat(live.questions || []);
          const categoryIds = new Set(
            categories.filter(c => !(live.deletedCategoryIds || []).includes(c.id)).map(c => c.id)
              .concat((live.categories || []).map(c => c.id))
          );
          const ids = new Set();
          for (const q of questions) {
            assert(q.id && !ids.has(q.id), 'Duplicate or missing question id: ' + q.id);
            ids.add(q.id);
            assert(categoryIds.has(q.cat), 'Question references missing category: ' + q.id + ' -> ' + q.cat);
            assert(typeof q.text === 'string' && q.text.trim(), 'Empty question: ' + q.id);
            assert(Array.isArray(q.opts) && q.opts.length === 4 && q.opts.every(x => String(x || '').trim()), 'Invalid options: ' + q.id);
            assert(Number.isInteger(q.correct) && q.correct >= 0 && q.correct < 4, 'Invalid correct answer: ' + q.id);
          }
          assert(admin.includes('<textarea id="source"'), 'Admin source field must support multiple lines');
          assert(admin.includes('const BASE_Q='), 'Admin must load the same base question data');
          assert(admin.includes('id="adminInstallBtn"'), 'Admin install button must exist');
          const counts = Object.fromEntries([...categoryIds].map(id => [id, questions.filter(q => q.cat === id).length]));
          console.log('Validated ' + questions.length + ' questions across ' + categoryIds.size + ' categories.');
          console.log(JSON.stringify(counts));
          function validateInlineScripts(html, label) {
            const scripts = [];
            for (const part of html.split('<script').slice(1)) {
              const start = part.indexOf('>');
              const end = part.indexOf('</script>');
              if (start >= 0 && end > start) {
                const source = part.slice(start + 1, end);
                if (source.trim()) scripts.push(source);
              }
            }
            for (const [i, source] of scripts.entries()) {
              try { new Function(source); }
              catch (error) { throw new Error(label + ' inline script ' + (i + 1) + ': ' + error.message); }
            }
          }
          validateInlineScripts(index, 'Game');
          validateInlineScripts(admin, 'Dashboard');
          console.log('Inline JavaScript syntax validated.');
          NODE
      - name: Prepare public site and installable admin dashboard
        run: |
          mkdir -p public-site public-site/admin
          rsync -a --exclude='/.git/' --exclude='/.github/' --exclude='/public-site/' --exclude='/admin-local.html' ./ public-site/
          cp admin-local.html public-site/admin/index.html
          cat > public-site/admin/manifest.webmanifest <<'EOF'
          {
            "name": "Quiz Master — لوحة التحكم",
            "short_name": "لوحة Quiz Master",
            "description": "إدارة بنك أسئلة Quiz Master",
            "lang": "ar",
            "dir": "rtl",
            "start_url": "./",
            "scope": "./",
            "display": "standalone",
            "background_color": "#08111f",
            "theme_color": "#101827",
            "icons": [{"src":"../icon.svg","sizes":"any","type":"image/svg+xml","purpose":"any maskable"}]
          }
          EOF
          cat > public-site/admin/sw.js <<'EOF'
          const CACHE="quiz-master-admin-v1";
          self.addEventListener("install",e=>e.waitUntil(caches.open(CACHE).then(c=>c.addAll(["./","./index.html","./manifest.webmanifest","../icon.svg"])).then(()=>self.skipWaiting())));
          self.addEventListener("activate",e=>e.waitUntil(caches.keys().then(keys=>Promise.all(keys.filter(k=>k!==CACHE).map(k=>caches.delete(k)))).then(()=>self.clients.claim())));
          self.addEventListener("fetch",e=>{if(e.request.method!=="GET")return;const u=new URL(e.request.url);if(u.origin!==location.origin)return;e.respondWith(fetch(e.request).then(r=>{if(r.ok){const copy=r.clone();caches.open(CACHE).then(c=>c.put(e.request,copy));}return r}).catch(()=>caches.match(e.request))) });
          EOF
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public-site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
